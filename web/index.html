<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClipCut</title>
<meta name="description" content="Paste a YouTube link, pick a start and end time, and download only that part.">
<meta name="theme-color" content="#0b1d2a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#0b1d2a;
  --text:#f2fbff;
  --muted:rgba(242,251,255,.62);
  --glass:rgba(255,255,255,.09);
  --glass-b:rgba(255,255,255,.22);
  --a:#19e3c1;
  --b:#ff9a5c;
  --c:#34a8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;min-height:100%}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 16px 40px;
  overflow-x:hidden;min-height:100vh;
}
button,input,select{-webkit-tap-highlight-color:transparent;font:inherit;outline:none}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:float 16s ease-in-out infinite}
.b1{width:55vmax;height:55vmax;left:-15vmax;top:-12vmax;background:radial-gradient(circle,var(--a),transparent 65%)}
.b2{width:50vmax;height:50vmax;right:-18vmax;top:25vh;background:radial-gradient(circle,var(--b),transparent 65%);animation-delay:-5s}
.b3{width:48vmax;height:48vmax;left:10vw;bottom:-22vmax;background:radial-gradient(circle,var(--c),transparent 65%);animation-delay:-10s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(6vmax,4vmax) scale(1.1)}66%{transform:translate(-4vmax,6vmax) scale(.94)}}

main{width:100%;max-width:520px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
header{display:flex;align-items:center;gap:12px;margin:8px 4px 20px}
header img{width:46px;height:46px;border-radius:14px;box-shadow:0 8px 24px rgba(25,227,193,.35)}
h1{margin:0;font-size:26px;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:2px 0 0;color:var(--muted);font-size:13.5px}

.card{
  background:var(--glass);border:1px solid var(--glass-b);border-radius:24px;padding:18px;
  -webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);
  box-shadow:0 20px 50px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.25);
  margin-bottom:16px;
}
.row{display:flex;gap:10px}
input[type=text]{
  flex:1;min-width:0;background:rgba(0,0,0,.22);border:1px solid var(--glass-b);color:var(--text);
  padding:14px 16px;border-radius:16px;font-size:15px;transition:border-color .2s,box-shadow .2s;
}
input[type=text]:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(25,227,193,.18)}
input::placeholder{color:rgba(242,251,255,.4)}

.btn{
  border:0;border-radius:16px;padding:14px 20px;color:#06202b;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--a),#7af0a8 55%,var(--b));background-size:200% 200%;
  transition:transform .15s,box-shadow .25s,filter .2s;box-shadow:0 10px 26px rgba(25,227,193,.3);
}
.btn:hover{background-position:100% 0;filter:brightness(1.05)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.full{width:100%;margin-top:6px;font-size:16px;padding:16px}

#clip{display:none}
#clip.show{display:block;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.preview{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.preview img{width:104px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:rgba(0,0,0,.3)}
.preview b{display:block;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.preview span{color:var(--muted);font-size:12.5px}

.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
label.t{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.times input{width:100%;text-align:center;font-variant-numeric:tabular-nums;font-size:18px;font-weight:600}

.range{position:relative;height:34px;margin:4px 6px 18px}
.track{position:absolute;left:0;right:0;top:15px;height:5px;border-radius:5px;background:rgba(255,255,255,.16)}
.fill{position:absolute;top:15px;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--a),var(--b))}
.range input[type=range]{
  position:absolute;left:0;width:100%;top:0;height:34px;margin:0;background:none;
  pointer-events:none;-webkit-appearance:none;appearance:none;
}
.range input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;pointer-events:auto;width:26px;height:26px;border-radius:50%;cursor:grab;
  background:rgba(255,255,255,.9);border:3px solid var(--a);box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.range input[type=range]::-moz-range-thumb{
  pointer-events:auto;width:20px;height:20px;border-radius:50%;cursor:grab;
  background:rgba(255,255,255,.9);border:3px solid var(--a);
}
.range input[type=range]::-webkit-slider-runnable-track{background:none}
.range input[type=range]::-moz-range-track{background:none}

.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{
  border:1px solid var(--glass-b);background:rgba(255,255,255,.07);color:var(--text);
  border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;transition:all .2s;
}
.chip.on{background:linear-gradient(135deg,var(--a),var(--b));color:#06202b;border-color:transparent;font-weight:700;transform:translateY(-1px)}

.msg{min-height:20px;font-size:13.5px;text-align:center;margin-top:12px;color:var(--muted)}
.msg.err{color:#ffb4a2}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:12px;display:none}
.bar.show{display:block}
.bar i{display:block;height:100%;width:40%;border-radius:6px;background:linear-gradient(90deg,var(--a),var(--b));animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<main>
  <header>
    <img src="icon.svg" alt="ClipCut icon">
    <div><h1>ClipCut</h1><p>Download only the part you need</p></div>
  </header>

  <section class="card">
    <div class="row">
      <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste YouTube link">
      <button class="btn" id="go">Load</button>
    </div>
    <div class="msg" id="msg1"></div>
  </section>

  <section class="card" id="clip">
    <div class="preview"><img id="thumb" alt=""><div><b id="title"></b><span id="dur"></span></div></div>

    <div class="range">
      <div class="track"></div><div class="fill" id="fill"></div>
      <input type="range" id="rs" min="0" max="100" value="0" step="1">
      <input type="range" id="re" min="0" max="100" value="100" step="1">
    </div>

    <div class="times">
      <div><label class="t" for="ts">Start</label><input id="ts" type="text" inputmode="numeric" value="0:00"></div>
      <div><label class="t" for="te">End</label><input id="te" type="text" inputmode="numeric" value="0:00"></div>
    </div>
    <div class="meta"><span>Clip length</span><b id="len">0:00</b></div>

    <div class="chips" id="chips">
      <button class="chip" data-q="360">360p</button>
      <button class="chip" data-q="480">480p</button>
      <button class="chip on" data-q="720">720p</button>
      <button class="chip" data-q="1080">1080p</button>
      <button class="chip" data-q="audio">Audio MP3</button>
    </div>

    <button class="btn full" id="dl">Download clip</button>
    <div class="bar" id="bar"><i></i></div>
    <div class="msg" id="msg2"></div>
    <div class="note">Only the selected range is fetched, so you don't spend data on the rest.</div>
  </section>
</main>

<script>
// Set this to your deployed backend URL (e.g. https://xyz.hf.space). Empty = same origin.
const API = (window.CLIPCUT_API || "https://clipcut-api.onrender.com").replace(/\/$/, "");

const $ = id => document.getElementById(id);
let duration = 0, quality = "720";

const fmt = s => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0");
};
const parse = t => {
  const p = t.trim().split(":").map(Number);
  if (p.some(isNaN) || !p.length || p.length > 3) return NaN;
  return p.reduce((a,v)=>a*60+v,0);
};

function sync(from){
  let a = +$("rs").value, b = +$("re").value;
  if (a >= b){ if (from === "rs") a = b-1; else b = a+1; }
  a = Math.max(0,a); b = Math.min(duration,b);
  $("rs").value = a; $("re").value = b;
  $("ts").value = fmt(a); $("te").value = fmt(b);
  $("len").textContent = fmt(b-a);
  const pct = v => duration ? v/duration*100 : 0;
  $("fill").style.left = pct(a)+"%";
  $("fill").style.width = (pct(b)-pct(a))+"%";
}
$("rs").oninput = () => sync("rs");
$("re").oninput = () => sync("re");
function fromText(){
  let a = parse($("ts").value), b = parse($("te").value);
  if (isNaN(a)) a = +$("rs").value;
  if (isNaN(b)) b = +$("re").value;
  a = Math.min(Math.max(0,a), duration-1); b = Math.min(Math.max(a+1,b), duration);
  $("rs").value = a; $("re").value = b; sync();
}
$("ts").onchange = fromText; $("te").onchange = fromText;

document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
  c.classList.add("on"); quality = c.dataset.q;
});

function say(id, text, err){ const e=$(id); e.textContent=text; e.className="msg"+(err?" err":""); }

$("go").onclick = async () => {
  const url = $("url").value.trim();
  if (!url) return say("msg1","Paste a YouTube link first.",1);
  say("msg1","Loading…"); $("go").disabled = true;
  try{
    const r = await fetch(API+"/api/info",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || "Failed");
    duration = d.duration || 0;
    if(!duration) throw new Error("Live streams aren't supported.");
    $("thumb").src = d.thumbnail; $("title").textContent = d.title; $("dur").textContent = "Length " + fmt(duration);
    ["rs","re"].forEach(i => $(i).max = duration);
    $("rs").value = 0; $("re").value = Math.min(duration, 30);
    sync(); say("msg1","");
    $("clip").classList.add("show");
    $("clip").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(e){ say("msg1", e.message || "Couldn't reach the server.", 1); }
  $("go").disabled = false;
};
$("url").addEventListener("keydown", e => { if(e.key==="Enter") $("go").click(); });

$("dl").onclick = async () => {
  const start = +$("rs").value, end = +$("re").value;
  say("msg2","Cutting your clip…"); $("bar").classList.add("show"); $("dl").disabled = true;
  try{
    const r = await fetch(API+"/api/clip",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url:$("url").value.trim(),start,end,quality})});
    if(!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.detail || "Download failed."); }
    const blob = await r.blob();
    const cd = r.headers.get("Content-Disposition") || "";
    const m = /filename\*?=(?:UTF-8'')?"?([^";]+)/i.exec(cd);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = m ? decodeURIComponent(m[1]) : "clip.mp4";
    document.body.appendChild(a); a.click(); a.remove();
    say("msg2","Done. Saved " + (blob.size/1048576).toFixed(1) + " MB.");
  }catch(e){ say("msg2", e.message || "Something went wrong.", 1); }
  $("bar").classList.remove("show"); $("dl").disabled = false;
};
</script>
</body>
</html>
